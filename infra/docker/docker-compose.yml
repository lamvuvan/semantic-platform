# docker-compose stack cho dev/staging trên 1 VM.
# Production dùng Ansible deploy từng dịch vụ trên VM riêng — file này phục vụ smoke test cục bộ.
version: "3.9"

services:
  neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data

  mcp:
    build:
      context: ../..
      dockerfile: infra/docker/mcp/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/sp/protocol/openid-connect/certs}
      MCP_TRANSPORT: http
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
      - redis

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/sp/protocol/openid-connect/certs}
    ports:
      - "8000:8000"
    depends_on:
      - neo4j

volumes:
  neo4j-data:
  redis-data:
  pg-data:
