---
- name: Neo4j Community 5.x — primary + warm standby
  hosts: neo4j_primary:neo4j_standby
  become: true
  vars:
    neo4j_version: "5.20.0"
    neo4j_data_dir: /var/lib/neo4j/data
    neo4j_backup_dir: /var/lib/neo4j/backups
    neo4j_heap_initial: "8g"
    neo4j_heap_max: "16g"
    neo4j_pagecache: "16g"
  tasks:
    - name: Add Neo4j apt repo
      apt_repository:
        repo: "deb https://debian.neo4j.com stable 5"
        state: present

    - name: Install Neo4j Community
      apt:
        name: "neo4j={{ neo4j_version }}"
        state: present
        update_cache: true

    - name: Configure neo4j.conf
      template:
        src: ../templates/neo4j.conf.j2
        dest: /etc/neo4j/neo4j.conf
        owner: neo4j
        group: neo4j
        mode: "0640"
      notify: restart neo4j

    - name: Install APOC Core plugin
      get_url:
        url: "https://github.com/neo4j/apoc/releases/download/{{ neo4j_version }}/apoc-{{ neo4j_version }}-core.jar"
        dest: /var/lib/neo4j/plugins/
        owner: neo4j
        mode: "0644"
      notify: restart neo4j

    - name: Apply schema (primary only)
      command: >
        cypher-shell -a bolt://localhost:7687 -u neo4j -p {{ neo4j_password }}
        -f /opt/semantic-platform/ontology/schema.cypher
      when: inventory_hostname in groups['neo4j_primary']
      run_once: true

    - name: Hourly backup cron
      cron:
        name: "neo4j hourly backup"
        minute: "30"
        hour: "*"
        job: >
          neo4j-admin database backup neo4j --to-path={{ neo4j_backup_dir }}
          && aws --endpoint-url={{ s3_endpoint }} s3 sync {{ neo4j_backup_dir }} s3://kg-backups/

  handlers:
    - name: restart neo4j
      service: { name: neo4j, state: restarted }
