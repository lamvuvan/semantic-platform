---
- name: Domain Service — FastAPI sau Nginx LB
  hosts: domain_servers
  become: true
  vars:
    image: "{{ registry_internal }}/semantic-platform/domain:{{ image_tag }}"
  tasks:
    - name: Ensure Docker installed
      apt: { name: docker.io, state: present }

    - name: Login internal registry
      docker_login:
        registry: "{{ registry_internal }}"
        username: "{{ registry_user }}"
        password: "{{ registry_password }}"

    - name: Pull image
      docker_image: { name: "{{ image }}", source: pull, force_source: true }

    - name: Run domain container
      docker_container:
        name: domain
        image: "{{ image }}"
        restart_policy: unless-stopped
        ports: ["8000:8000"]
        env:
          NEO4J_URI: "{{ neo4j_uri }}"
          NEO4J_USER: "{{ neo4j_user }}"
          NEO4J_PASSWORD: "{{ vault_neo4j_password }}"
          ELASTICSEARCH_URL: "{{ es_url }}"
          QDRANT_URL: "{{ qdrant_url }}"
          POSTGRES_DSN: "{{ vault_postgres_dsn }}"
          EMBEDDING_URL: "{{ embedding_url }}"
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "{{ otel_endpoint }}"
        volumes:
          - /etc/ssl/internal:/certs:ro
        log_driver: json-file
        log_options: { max-size: "100m", max-file: "5" }
