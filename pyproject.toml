[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-platform"
version = "0.1.0"
description = "F&B Knowledge Graph semantic layer for AI agents"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "strawberry-graphql[fastapi]>=0.230",
]
loaders = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "fastmcp>=2.3",
    "redis>=5.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "strawberry-graphql[fastapi]>=0.230",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["mcp*", "agents*", "loaders*", "api*", "eval*", "tests*"]
exclude = ["infra*", "docs*", "ontology*", "transforms*", "airflow*", "ci*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
