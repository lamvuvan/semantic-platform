[build-system]
requires = ["setuptools==75.6.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-platform"
version = "0.1.0"
description = "F&B Knowledge Graph semantic layer for AI agents"
requires-python = ">=3.12"
dependencies = [
    "neo4j==5.27.0",
    "PyYAML==6.0.2",
    "jsonschema==4.23.0",
    "PyJWT[crypto]==2.10.1",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp==2.10.6",
    "redis==5.2.1",
    "httpx==0.28.1",
]
api = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "strawberry-graphql[fastapi]==0.253.0",
]
loaders = [
    "boto3==1.35.92",
    "botocore==1.35.92",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-asyncio==0.25.2",
    "ruff==0.8.4",
    "bandit==1.8.0",
    "semgrep==1.103.0",
    "build==1.2.2.post1",
    "pip-tools==7.4.1",
    "fastmcp==2.10.6",
    "redis==5.2.1",
    "httpx==0.28.1",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "strawberry-graphql[fastapi]==0.253.0",
    "boto3==1.35.92",
    "botocore==1.35.92",
]

[tool.setuptools.packages.find]
include = ["mcp*", "agents*", "loaders*", "api*", "eval*", "tests*"]
exclude = ["infra*", "docs*", "ontology*", "transforms*", "airflow*", "ci*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
